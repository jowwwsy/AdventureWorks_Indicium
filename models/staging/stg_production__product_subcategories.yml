version: 2

models:
  - name: stg_production__product_subcategories
    description: >
      Staged product subcategory records from the AdventureWorks production schema.
      Each subcategory belongs to a parent product category and groups related products.

    columns:
      - name: product_subcategory_id
        description: Primary key. Unique identifier for each product subcategory.
        tests:
          - not_null
          - unique

      - name: product_category_id
        description: Foreign key to stg_production__product_categories. Identifies the parent category.
        tests:
          - not_null

      - name: subcategory_nm
        description: Name of the product subcategory (e.g. Road Bikes, Helmets).
        tests:
          - not_null
          - unique

      - name: modified_at
        description: Timestamp of the last record modification.
        tests:
          - not_null