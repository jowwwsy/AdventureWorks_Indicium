version: 2

models:
  - name: int_sales_reason
    description: >
      One row per sales order, enriched with the primary sales reason.
      Where an order has multiple reasons recorded in the bridge table,
      the lowest sales_reason_id is selected to produce a single reason
      per order. Orders with no reason recorded are retained with null
      reason fields via the left join.

    columns:
      - name: sales_order_id
        description: Primary key. Unique identifier for the sales order.
        tests:
          - not_null
          - unique

      - name: agg_sales_reason_id
        description: >
          Identifies all reason associated with this order. Null when no reason is recorded.

      - name: agg_sales_reason_nm
        description: >
          All Name of the sales reason
          Null when no reason is recorded for the order.

      - name: agg_reason_types
        description: >
          All High-level category grouping the sales reason
          Null when no reason is recorded for the order.