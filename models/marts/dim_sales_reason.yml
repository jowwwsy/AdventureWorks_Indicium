version: 2

models:
  - name: dim_sales_reason
    description: >
      Sales reason dimension. Each row is a reason code explaining why a customer
      placed an order. 
    columns:
      - name: sales_order_id
        description: Primary key from sales order. 
        tests:
          - not_null
          - unique

      - name: agg_sales_reason_nm
        description: Agregate reason from sales. 
        tests:
          - not_null

      - name: agg_reason_type
        description: Agregate High-level reason category.
        tests:
          - not_null